<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Monitor - ZAR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --night: #120a10; --deep: #1c1018; --panel: rgba(38, 22, 32, .92);
    --line: rgba(236, 190, 170, .22); --line-soft: rgba(236, 190, 170, .10);
    --cyan: #ecbea9; --ice: #fbefe7; --text: #d9c2b8; --text-dim: #957c76;
    --amber: #ffb44d; --alert: #ff6b7d; --green: #6ee7a8; --violet: #b69cff; --orange: #ff8f4d;
    --font: "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI Semibold", "Arial Narrow", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); font-family: var(--font); overflow: hidden; }
  .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--deep); min-width: 0; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .14em; color: var(--ice); font-weight: 600; white-space: nowrap; }
  header h1 span { color: var(--cyan); }
  .ticker { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; border-left: 1px solid var(--line); padding-left: 14px; }
  .ticker .track { display: inline-block; animation: scroll 60s linear infinite; }
  .ticker .item { margin-right: 48px; color: var(--ice); }
  .ticker .item b { color: var(--alert); letter-spacing: .08em; margin-right: 6px; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .status { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green);
                 margin-right: 6px; box-shadow: 0 0 8px var(--green); }
  button { font-family: var(--font); }
  .btn { background: transparent; color: var(--cyan); border: 1px solid var(--line); border-radius: 4px;
         padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .btn:hover { border-color: var(--cyan); background: rgba(70, 36, 52, .6); }
  #map { height: 100%; background: var(--night); }
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .stat { padding: 10px 8px; text-align: center; border-right: 1px solid var(--line-soft); }
  .stat:last-child { border-right: 0; }
  .stat .n { font-size: 24px; color: var(--ice); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; border-radius: 999px;
          border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .chip[aria-pressed="false"] { opacity: .4; }
  .list { overflow-y: auto; flex: 1; min-height: 0; }
  .ev { display: grid; grid-template-columns: 10px 1fr; column-gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
        cursor: pointer; }
  .ev:hover { background: rgba(70, 36, 52, .45); }
  .ev i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
  .ev .t { color: var(--ice); font-size: 15px; line-height: 1.25; }
  .ev .m { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  .ev.sev3 .t { color: #ffd2d8; }
  .ev.sev3 i { box-shadow: 0 0 10px var(--alert); }
  .empty { padding: 24px; color: var(--text-dim); text-align: center; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--deep); color: var(--text); border: 1px solid var(--line); }
  .leaflet-popup-content { font-family: var(--font); font-size: 14px; margin: 10px 12px; }
  .leaflet-popup-content b { color: var(--ice); }
  .leaflet-popup-content a { color: var(--cyan); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--text-dim); }
  .leaflet-control-attribution { background: rgba(18, 10, 16, .7) !important; color: var(--text-dim) !important; }
  .leaflet-control-attribution a { color: var(--text-dim) !important; }
  body.osm .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.4); }
  .pulse { border-radius: 50%; animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 107, 125, .7); } 100% { box-shadow: 0 0 0 18px rgba(255, 107, 125, 0); } }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 55vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } .ticker { display: none; } }
  @media (prefers-reduced-motion: reduce) { .ticker .track, .pulse { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>WORLD <span>MONITOR</span></h1>
    <div class="ticker" aria-live="polite"><div class="track" id="ticker"></div></div>
    <div class="status" id="status"><span class="dot"></span>Loading…</div>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </header>
  <div id="map" role="region" aria-label="World map"></div>
  <aside>
    <div class="stats">
      <div class="stat"><div class="n" id="s-quakes">–</div><div class="l">Quakes</div></div>
      <div class="stat"><div class="n" id="s-alerts">–</div><div class="l">Alerts</div></div>
      <div class="stat"><div class="n" id="s-nature">–</div><div class="l">Nature</div></div>
      <div class="stat"><div class="n" id="s-news">–</div><div class="l">News</div></div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"><div class="empty">Loading live data…</div></div>
  </aside>
</div>
<script>
(() => {
  const TOKEN = "__HUD_TOKEN__";
  const AUTH = { "X-ZAR-Token": TOKEN };
  const $ = id => document.getElementById(id);
  const GROUPS = {
    earthquake: { label: "Earthquakes", color: "#ffb44d" },
    disaster:   { label: "Disasters",   color: "#ff6b7d" },
    fire:       { label: "Wildfires",   color: "#ff8f4d" },
    storm:      { label: "Storms",      color: "#b69cff" },
    volcano:    { label: "Volcanoes",   color: "#ff4d6d" },
    news:       { label: "News",        color: "#ecbea9" },
  };
  const groupOf = t => ({ earthquake: "earthquake", tsunami: "earthquake", wildfire: "fire", storm: "storm",
                          cyclone: "storm", volcano: "volcano", news: "news" }[t] || "disaster");
  const on = Object.fromEntries(Object.keys(GROUPS).map(k => [k, true]));
  let events = [];

  const map = L.map("map", { worldCopyJump: true, zoomControl: true, minZoom: 2 }).setView([25, 10], 2.4);
  // Key-less dark basemap (Esri). If it fails, fall back to OpenStreetMap darkened with CSS.
  const SRC = "USGS · GDACS · NASA EONET";
  const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Tiles &copy; Esri · " + SRC, maxZoom: 16,
  }).addTo(map);
  const esriLabels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 16, pane: "overlayPane", opacity: .9,
  }).addTo(map);
  let tileErrors = 0;
  esri.on("tileerror", () => {
    if (++tileErrors !== 6) return;
    map.removeLayer(esri); map.removeLayer(esriLabels);
    document.body.classList.add("osm");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ' + SRC, maxZoom: 16,
    }).addTo(map);
  });
  const layer = L.layerGroup().addTo(map);
  const markers = new Map();

  function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function ago(ts) {
    const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
    return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
  }
  function popup(e) {
    return `<b>${esc(e.title)}</b><br><span style="color:#957c76">${esc(e.source)} · ${ago(e.ts)}</span>` +
           (e.detail ? `<br>${esc(e.detail)}` : "") +
           (e.url ? `<br><a href="${esc(e.url)}" target="_blank" rel="noopener">Open source ↗</a>` : "");
  }

  function renderFilters() {
    $("filters").innerHTML = Object.entries(GROUPS).map(([k, g]) =>
      `<button class="chip" type="button" data-k="${k}" aria-pressed="${on[k]}"><i style="background:${g.color}"></i>${g.label}</button>`).join("");
    $("filters").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      on[b.dataset.k] = !on[b.dataset.k]; renderFilters(); render();
    }));
  }

  function render() {
    layer.clearLayers(); markers.clear();
    const shown = events.filter(e => on[groupOf(e.type)]);
    for (const e of shown) {
      if (e.lat == null) continue;
      const g = GROUPS[groupOf(e.type)];
      const r = e.type === "earthquake" ? Math.max(4, (parseFloat((e.title.match(/M([\d.]+)/) || [])[1]) || 3) * 2.2)
              : e.severity >= 3 ? 11 : e.severity === 2 ? 8 : 6;
      const m = L.circleMarker([e.lat, e.lon], {
        radius: r, color: g.color, weight: e.severity >= 3 ? 2.5 : 1.2, fillColor: g.color,
        fillOpacity: e.type === "news" ? .35 : .55, className: e.severity >= 3 ? "pulse" : "",
      }).bindPopup(popup(e));
      m.addTo(layer); markers.set(e.id, m);
    }
    $("list").innerHTML = shown.length ? shown.slice(0, 250).map(e => {
      const g = GROUPS[groupOf(e.type)];
      return `<div class="ev sev${e.severity}" data-id="${esc(e.id)}" tabindex="0">
        <i style="background:${g.color}"></i>
        <div><div class="t">${esc(e.title)}</div><div class="m">${esc(e.source)} · ${ago(e.ts)}${e.lat == null ? " · global" : ""}</div></div></div>`;
    }).join("") : `<div class="empty">Nothing to show with these filters.</div>`;
    $("list").querySelectorAll(".ev").forEach(el => {
      const go = () => {
        const e = events.find(x => x.id === el.dataset.id);
        const m = markers.get(el.dataset.id);
        if (m) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 5), { duration: .8 }); m.openPopup(); }
        else if (e && e.url) window.open(e.url, "_blank", "noopener");
      };
      el.addEventListener("click", go);
      el.addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
    });
  }

  function renderStats() {
    const day = Date.now() / 1000 - 86400;
    $("s-quakes").textContent = events.filter(e => e.type === "earthquake" && e.ts >= day).length;
    $("s-alerts").textContent = events.filter(e => e.source === "GDACS").length;
    $("s-nature").textContent = events.filter(e => e.source === "NASA EONET").length;
    $("s-news").textContent = events.filter(e => e.type === "news").length;
    const hot = events.filter(e => e.severity >= 2).sort((a, b) => b.severity - a.severity || b.ts - a.ts).slice(0, 12);
    const html = hot.map(e => `<span class="item"><b>${e.severity >= 3 ? "ALERT" : "LIVE"}</b>${esc(e.title)}</span>`).join("");
    $("ticker").innerHTML = html + html;   // duplicated for a seamless loop
  }

  async function load(force = false) {
    $("status").innerHTML = `<span class="dot" style="background:#ffb44d;box-shadow:0 0 8px #ffb44d"></span>Updating…`;
    try {
      const r = await fetch("/world_events" + (force ? "?refresh=1" : ""), { headers: AUTH });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "error");
      events = d.events || [];
      render(); renderStats();
      const t = new Date((d.updated || Date.now() / 1000) * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const warn = (d.errors || []).length ? ` · ${(d.errors || []).length} source(s) offline` : "";
      $("status").innerHTML = `<span class="dot"></span>Live · ${t}${warn}`;
      $("status").title = (d.errors || []).join("\n");
    } catch (err) {
      $("status").innerHTML = `<span class="dot" style="background:#ff6b7d;box-shadow:0 0 8px #ff6b7d"></span>ZAR offline`;
    }
  }

  $("refresh").addEventListener("click", () => load(true));
  renderFilters();
  load();
  setInterval(load, 120000);
})();
</script>
</body>
</html>
