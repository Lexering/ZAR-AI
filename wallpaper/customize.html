<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAR · Personalizar</title>
<!-- ZAR - customise the animated desktop (panels, colour, quick launch, Pomodoro). Opened from the wallpaper. -->
<style>
  :root {
    --bg: #120a10; --card: rgba(38, 22, 32, .7); --line: rgba(236, 190, 170, .16); --line-hi: rgba(236, 190, 170, .4);
    --accent: #ecbea9; --ice: #fbefe7; --text: #d9c2b8; --dim: #957c76; --red: #ff6b81;
    --font: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.45 var(--font); }
  body { padding: 20px 22px 28px; background: radial-gradient(ellipse 120% 50% at 50% 0%, #3a1c2c 0%, var(--bg) 70%) fixed, var(--bg); }
  h1 { margin: 0; font-size: 22px; font-weight: 600; color: var(--ice); }
  .sub { margin: 2px 0 14px; color: var(--dim); font-size: 13.5px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tg { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--ice); }
  .tg:hover { border-color: var(--line-hi); }
  .tg input { accent-color: var(--accent); width: 17px; height: 17px; }
  .sw { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
  .sw button.on { border-color: var(--ice); }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ice); }
  .item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .n small { color: var(--dim); margin-left: 6px; }
  .ib { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font-size: 14px; }
  .ib:hover { border-color: var(--accent); color: var(--ice); }
  .ib.del:hover { border-color: var(--red); color: var(--red); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text], input[type=number], select { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(0,0,0,.3); color: var(--ice); font: inherit; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: #241420; }
  .btn { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line-hi); background: rgba(56,32,46,.8); color: var(--ice); font: inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
  .pomo { display: flex; gap: 10px; align-items: center; }
  .pomo label { color: var(--dim); font-size: 13px; }
  .pomo input { width: 80px; flex: none; }
  .note { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: rgba(56,32,46,.95);
          border: 1px solid var(--line-hi); color: var(--ice); opacity: 0; transition: opacity .25s; pointer-events: none; }
  .note.show { opacity: 1; }
</style>
</head>
<body>
<h1 id="t-title">Personalizar el escritorio</h1>
<div class="sub" id="t-sub">Los cambios se ven en el fondo al momento.</div>

<section><h2 id="t-panels">Paneles</h2><div class="toggles" id="panels"></div></section>
<section><h2 id="t-color">Color</h2><div class="sw" id="accents"></div>
  <label class="tg" style="margin-top:12px"><input type="checkbox" id="bg"><span id="t-bg">Fondo animado (partículas)</span></label></section>
<section><h2 id="t-apps">Accesos rápidos</h2>
  <div class="list" id="apps"></div>
  <div class="row"><select id="preset"></select><button class="btn" id="add-preset" type="button">Añadir</button></div>
  <div class="row"><input type="text" id="c-name" placeholder="Nombre" maxlength="24"><input type="text" id="c-url" placeholder="Web o programa"><button class="btn" id="add-custom" type="button">Añadir</button></div>
  <div class="hint" id="t-hint">Web (ej. moodle.miuni.es) o la ruta de un programa o carpeta del PC.</div>
</section>
<section><h2>Pomodoro</h2>
  <div class="pomo"><label id="t-focus">Concentración</label><input type="number" id="p-f" min="1" max="180"><label>min</label>
    <label id="t-break" style="margin-left:10px">Descanso</label><input type="number" id="p-b" min="1" max="60"><label>min</label>
    <button class="btn" id="p-save" type="button" style="margin-left:auto">OK</button></div>
</section>
<div class="note" id="note"></div>

<script>
(() => {
  const BASE = "http://127.0.0.1:5055";
  const AUTH = { "X-ZAR-Token": "__HUD_TOKEN__" };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NAMES = { classroom: "Classroom", drive: "Drive", youtube: "YouTube", scholar: "Scholar", notebooklm: "NotebookLM", translate: "Translate",
    gemini: "Gemini", gmail: "Gmail", whatsapp: "WhatsApp", chatgpt: "ChatGPT", outlook: "Outlook", teams: "Teams", onedrive: "OneDrive", office: "Office",
    canva: "Canva", duolingo: "Duolingo", khan: "Khan Academy", wikipedia: "Wikipedia", spotify: "Spotify", calendar: "Google Calendar", docs: "Google Docs",
    quizlet: "Quizlet", claude: "Claude", perplexity: "Perplexity" };
  const ACC = { rose: "#ecbea9", blue: "#8cc8ff", green: "#9fe0b0", violet: "#c3a8ff", amber: "#ffd08a", red: "#ff9a9a" };
  const TX = {
    es: { title: "Personalizar el escritorio", sub: "Los cambios se ven en el fondo al momento.", panels: "Paneles", color: "Color", bg: "Fondo animado (partículas)",
          apps: "Accesos rápidos", hint: "Web (ej. moodle.miuni.es) o la ruta de un programa o carpeta del PC.", focus: "Concentración", brk: "Descanso",
          add: "Añadir", name: "Nombre", url: "Web o programa", saved: "Guardado", choose: "Elige una app…", need: "Pon nombre y dirección", max: "Máximo 16 accesos",
          p: { weather: "Tiempo", tasks: "Tareas de hoy", exams: "Exámenes", files: "Mis archivos", pomodoro: "Pomodoro", apps: "Accesos", news: "IA y mundo" } },
    en: { title: "Customise the desktop", sub: "Changes show on the wallpaper right away.", panels: "Panels", color: "Colour", bg: "Animated background (particles)",
          apps: "Quick launch", hint: "A website (e.g. moodle.myuni.edu) or the path of a program or folder on this PC.", focus: "Focus", brk: "Break",
          add: "Add", name: "Name", url: "Website or program", saved: "Saved", choose: "Pick an app…", need: "Add a name and an address", max: "16 shortcuts at most",
          p: { weather: "Weather", tasks: "Today's tasks", exams: "Exams", files: "My files", pomodoro: "Pomodoro", apps: "Quick launch", news: "AI & world" } },
  };
  let L = TX.es, d = null;

  function note(m) { const n = $("note"); n.textContent = m; n.classList.add("show"); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove("show"), 1600); }
  async function save(part) {
    try {
      const r = await (await fetch(BASE + "/desktop", { method: "POST", headers: { ...AUTH, "Content-Type": "application/json" }, body: JSON.stringify(part) })).json();
      if (r.ok) { d = r; render(); note(L.saved); }
    } catch { note("ZAR?"); }
  }
  function render() {
    const hidden = new Set(d.hidden || []);
    $("panels").innerHTML = Object.entries(L.p).map(([k, v]) => `<label class="tg"><input type="checkbox" data-k="${k}" ${hidden.has(k) ? "" : "checked"}>${v}</label>`).join("");
    $("panels").querySelectorAll("input").forEach(i => i.onchange = () => {
      const h = new Set(d.hidden || []); i.checked ? h.delete(i.dataset.k) : h.add(i.dataset.k); save({ hidden: [...h] });
    });
    $("accents").innerHTML = Object.entries(ACC).map(([k, c]) => `<button type="button" data-k="${k}" class="${d.accent === k ? "on" : ""}" style="background:${c}" aria-label="${k}"></button>`).join("");
    $("accents").querySelectorAll("button").forEach(b => b.onclick = () => save({ accent: b.dataset.k }));
    document.documentElement.style.setProperty("--accent", ACC[d.accent] || ACC.rose);
    $("bg").checked = d.bg !== false;
    const apps = d.apps || [];
    $("apps").innerHTML = apps.map((a, i) => `<div class="item"><span class="n">${esc(a.key ? (NAMES[a.key] || a.key) : a.name)}${a.url ? `<small>${esc(a.url)}</small>` : ""}</span>
      <button class="ib" data-m="up" data-i="${i}" type="button" aria-label="Subir">↑</button><button class="ib" data-m="down" data-i="${i}" type="button" aria-label="Bajar">↓</button>
      <button class="ib del" data-m="del" data-i="${i}" type="button" aria-label="Quitar">✕</button></div>`).join("");
    $("apps").querySelectorAll(".ib").forEach(b => b.onclick = () => {
      const a = [...apps], i = +b.dataset.i;
      if (b.dataset.m === "del") a.splice(i, 1);
      else { const j = b.dataset.m === "up" ? i - 1 : i + 1; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; }
      save({ apps: a });
    });
    const used = new Set(apps.filter(a => a.key).map(a => a.key));
    $("preset").innerHTML = `<option value="">${L.choose}</option>` + (d.presets || Object.keys(NAMES)).filter(k => !used.has(k))
      .map(k => `<option value="${k}">${esc(NAMES[k] || k)}</option>`).join("");
    if (document.activeElement !== $("p-f")) $("p-f").value = (d.pomo || [25, 5])[0];
    if (document.activeElement !== $("p-b")) $("p-b").value = (d.pomo || [25, 5])[1];
  }
  $("bg").onchange = () => save({ bg: $("bg").checked });
  $("add-preset").onclick = () => { const k = $("preset").value; if (!k) return; if ((d.apps || []).length >= 16) return note(L.max); save({ apps: [...(d.apps || []), { key: k }] }); };
  $("add-custom").onclick = () => {
    const name = $("c-name").value.trim(), url = $("c-url").value.trim();
    if (!name || !url) return note(L.need);
    if ((d.apps || []).length >= 16) return note(L.max);
    save({ apps: [...(d.apps || []), { name, url }] }); $("c-name").value = ""; $("c-url").value = "";
  };
  $("p-save").onclick = () => save({ pomo: [+$("p-f").value || 25, +$("p-b").value || 5] });

  async function init() {
    try { const s = await (await fetch(BASE + "/state", { cache: "no-store" })).json(); if (s.lang === "en") L = TX.en; } catch {}
    document.documentElement.lang = L === TX.en ? "en" : "es";
    $("t-title").textContent = L.title; $("t-sub").textContent = L.sub; $("t-panels").textContent = L.panels; $("t-color").textContent = L.color;
    $("t-bg").textContent = L.bg; $("t-apps").textContent = L.apps; $("t-hint").textContent = L.hint; $("t-focus").textContent = L.focus; $("t-break").textContent = L.brk;
    $("add-preset").textContent = L.add; $("add-custom").textContent = L.add; $("c-name").placeholder = L.name; $("c-url").placeholder = L.url;
    document.title = "ZAR · " + L.title;
    try { d = await (await fetch(BASE + "/desktop", { headers: AUTH, cache: "no-store" })).json(); } catch { d = null; }
    if (d && d.ok) render(); else note("ZAR?");
  }
  init();
})();
</script>
</body>
</html>
