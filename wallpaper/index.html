<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAR HUD</title>
<!--
  ZAR - animated desktop for Lively Wallpaper.
  Talks to ZAR at http://127.0.0.1:5055 (state, weather, tasks, news, Pomodoro events).
  Lively: Settings -> Wallpaper -> Wallpaper input: Mouse (so the buttons can be clicked).
-->
<style>
  :root {
    --bg: #120a10; --bg2: #1c1018; --glass: rgba(38, 22, 32, .60); --glass-hi: rgba(56, 32, 46, .74);
    --line: rgba(236, 190, 170, .16); --line-hi: rgba(236, 190, 170, .38);
    --cyan: #ecbea9; --teal: #d8ad7c; --ice: #fbefe7; --text: #d9c2b8; --dim: #957c76;
    --amber: #f2c27b; --red: #ff6b81; --violet: #a98bff;
    --font: "Segoe UI Variable Display", "Segoe UI", "Inter", system-ui, sans-serif;
    --mono: "Cascadia Code", "Consolas", monospace;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); user-select: none; }
  canvas#bg { position: fixed; inset: 0; z-index: 0; }
  .app { position: relative; z-index: 1; height: 100vh; display: grid;
         grid-template-columns: minmax(300px, 23vw) 1fr minmax(300px, 23vw);
         gap: 2vw; padding: 3.2vh 2.4vw 4vh; }
  .col { display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r);
           backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 1.6vh 1.2vw; }
  .panel h3 { margin: 0 0 1.1vh; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
              color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .panel h3::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .panel h3 .more { margin-left: auto; letter-spacing: .08em; text-transform: none; font-weight: 500; color: var(--cyan); cursor: pointer; }

  /* greeting + clock */
  .hello { font-size: clamp(16px, 1.15vw, 22px); color: var(--text); }
  .hello b { color: var(--ice); font-weight: 600; }
  .clock { font-size: clamp(48px, 5vw, 96px); font-weight: 200; color: var(--ice); letter-spacing: -.02em; line-height: 1; margin: .6vh 0 .3vh; font-variant-numeric: tabular-nums; }
  .date { font-size: clamp(13px, .9vw, 16px); color: var(--dim); }
  .weather { display: flex; align-items: center; gap: 12px; margin-top: 1.4vh; padding-top: 1.4vh; border-top: 1px solid var(--line); }
  .weather .ico { font-size: 30px; }
  .weather .t { font-size: 24px; color: var(--ice); font-weight: 300; }
  .weather .d { font-size: 12.5px; color: var(--dim); line-height: 1.35; }

  /* lists */
  .list { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 9px; background: rgba(255,255,255,.025);
         border: 1px solid transparent; font-size: 13.5px; color: var(--ice); cursor: pointer; }
  .row:hover { border-color: var(--line-hi); background: rgba(236, 190, 170, .06); }
  .row .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--cyan); }
  .row .dot.over { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .row .dot.today { background: var(--amber); }
  .row .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tag { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .empty { font-size: 13px; color: var(--dim); padding: 4px 2px; }

  /* exams */
  .exam { display: flex; align-items: baseline; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .exam:last-child { border-bottom: 0; }
  .exam .days { font-size: 30px; font-weight: 200; color: var(--ice); width: 78px; flex: none; font-variant-numeric: tabular-nums; }
  .exam .days .tdy { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .exam .days small { font-size: 11px; color: var(--dim); margin-left: 2px; }
  .exam.soon .days { color: var(--amber); }
  .exam.now .days { color: var(--red); }
  .exam .nm { color: var(--ice); font-size: 14px; }
  .exam .when { color: var(--dim); font-size: 12px; }

  /* centre: ZAR core */
  .centre { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh; min-width: 0; }
  .core { position: relative; width: min(34vh, 26vw); aspect-ratio: 1; cursor: pointer; }
  .core svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .core .label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .core .name { font-size: min(6.4vh, 4.8vw); font-weight: 600; letter-spacing: .32em; color: var(--ice); margin-left: .32em;
                text-shadow: 0 0 22px rgba(236, 190, 170, .55); }
  .state { font-family: var(--mono); font-size: 12px; letter-spacing: .3em; color: var(--cyan); text-transform: uppercase; }
  .hint { font-size: clamp(14px, 1vw, 18px); color: var(--text); text-align: center; min-height: 1.4em; }
  .bubble { max-width: min(46vw, 760px); text-align: center; font-size: clamp(14px, 1.05vw, 19px); line-height: 1.45; color: var(--ice);
            min-height: 3em; opacity: .95; }
  .bubble .who { display: block; font-size: 11px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; margin-bottom: 4px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--glass); color: var(--ice); font-family: var(--font); font-size: 13.5px; cursor: pointer; backdrop-filter: blur(10px); }
  .pill:hover { border-color: var(--cyan); background: var(--glass-hi); }
  .pill svg { width: 16px; height: 16px; stroke: var(--cyan); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pill.muted { border-color: rgba(255, 107, 129, .5); }
  .pill.muted svg { stroke: var(--red); }

  /* pomodoro */
  .pomo { display: flex; align-items: center; gap: 1.2vw; }
  .pomo .ring { position: relative; width: 108px; height: 108px; flex: none; }
  .pomo .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .pomo .ring .tm { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; color: var(--ice); font-weight: 300; font-variant-numeric: tabular-nums; }
  .pomo .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .pomo .mode { font-size: 13px; color: var(--ice); }
  .pomo .mode small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--cyan); font-family: var(--font); font-size: 12.5px; cursor: pointer; }
  .btn:hover { border-color: var(--cyan); background: rgba(236, 190, 170, .08); }

  /* quick launch */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .app-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px;
             border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--text); font-family: var(--font); font-size: 11.5px; cursor: pointer; }
  .app-btn:hover { border-color: var(--cyan); color: var(--ice); background: rgba(236, 190, 170, .07); }
  .app-btn svg { width: 22px; height: 22px; stroke: var(--cyan); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* news */
  .news { overflow-y: auto; scrollbar-width: none; flex: 1; min-height: 0; }
  .news::-webkit-scrollbar { display: none; }
  .news .item { padding: 7px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .news .item:last-child { border-bottom: 0; }
  .news .item .h { font-size: 13px; color: var(--ice); line-height: 1.35; }
  .news .item .s { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .news .item.ai .h::before { content: "AI · "; color: var(--teal); font-weight: 600; }
  .news .item:hover .h { color: var(--cyan); }
  .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .sys { display: flex; gap: 14px; font-family: var(--mono); font-size: 11px; color: var(--dim); justify-content: flex-end; }
  .sys b { color: var(--text); font-weight: 500; }
  .toast { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: var(--glass-hi);
           border: 1px solid var(--line-hi); color: var(--ice); font-size: 13px; opacity: 0; transition: opacity .25s; z-index: 5; }
  .toast.show { opacity: 1; }
  .offline .core { filter: grayscale(1) brightness(.6); }
  /* folder: Mis archivos / My files */
  .folder { cursor: pointer; transition: border-color .25s, background .25s, box-shadow .25s; }
  .folder:hover, .folder:focus-visible { border-color: var(--line-hi); background: var(--glass-hi); outline: none; }
  .folder.over { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 34px rgba(236,190,169,.2); }
  .folder .fh { display: flex; align-items: center; gap: 14px; }
  .folder .fi { width: 46px; height: 46px; flex: none; transition: transform .25s; }
  .folder:hover .fi, .folder.over .fi { transform: translateY(-2px); }
  .folder .fi svg { width: 100%; height: 100%; fill: none; stroke: var(--cyan); stroke-width: 1.3; stroke-linejoin: round; }
  .folder .ft { font-size: 19px; font-weight: 600; color: var(--ice); line-height: 1.15; }
  .folder .fs { font-size: 12.5px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder .thumbs { display: flex; gap: 8px; margin-top: 1.2vh; }
  .folder .thumbs:empty { display: none; }
  .folder .tb { position: relative; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25);
                overflow: hidden; display: grid; place-items: center; flex: none; }
  .folder .tb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .folder .tb svg { width: 19px; height: 19px; fill: none; stroke: var(--cyan); stroke-width: 1.5; }
  .folder .tb.more { font-size: 12px; color: var(--dim); }
  .fveil { position: fixed; inset: 0; z-index: 9; background: rgba(10, 5, 9, .6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
           display: none; align-items: center; justify-content: center; }
  .fveil.show { display: flex; }
  .fpanel { width: min(980px, 90vw); height: min(760px, 84vh); display: flex; flex-direction: column; background: rgba(30, 16, 25, .96);
            border: 1px solid var(--line-hi); border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.55); overflow: hidden; position: relative; user-select: none; }
  .fpanel header { display: flex; align-items: center; gap: 10px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
  .fpanel h2 { margin: 0; font-size: 24px; font-weight: 600; color: var(--ice); flex: 1; letter-spacing: .02em; }
  .fpanel .x { background: none; border: 1px solid var(--line); color: var(--ice); width: 36px; height: 36px; border-radius: 50%; font-size: 17px; cursor: pointer; }
  .fpanel .x:hover { border-color: var(--cyan); }
  .fbody { flex: 1; overflow-y: auto; padding: 18px 22px 22px; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 14px; background: var(--glass); overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s; }
  .tile:hover { border-color: var(--line-hi); }
  .tile .th { height: 110px; flex: none; display: grid; place-items: center; background: rgba(0,0,0,.25); position: relative; overflow: hidden; }
  .tile .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .th svg { width: 40px; height: 40px; fill: none; stroke: var(--cyan); stroke-width: 1.4; }
  .tile .th .ext { position: absolute; bottom: 14px; font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--cyan); }
  .tile .nm { padding: 8px 10px 2px; font-size: 13px; color: var(--ice); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .mt { padding: 0 10px 6px; font-size: 11px; color: var(--dim); }
  .tile .ta { display: flex; gap: 4px; padding: 0 8px 8px; }
  .tile .ta button { flex: 1; padding: 5px 0; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.2); color: var(--ice); font-size: 11.5px; cursor: pointer; font-family: var(--font); }
  .tile .ta button:hover { border-color: var(--cyan); }
  .tile .ta button.arm { background: var(--red); color: #2a0a12; border-color: var(--red); }
  .drop { position: absolute; inset: 0; display: none; place-items: center; background: rgba(236,190,169,.1); border: 2px dashed var(--cyan);
          border-radius: 20px; font-size: 26px; color: var(--ice); pointer-events: none; }
  .fpanel.over .drop { display: grid; }
  .fempty { text-align: center; color: var(--dim); padding: 8vh 0; font-size: 15px; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app" id="app">
  <!-- LEFT -->
  <div class="col">
    <section class="panel">
      <div class="hello" id="hello">Hola</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="weather" id="weather"><span class="ico">⛅</span><div><div class="t">--°</div><div class="d" data-i18n="loadingWeather">…</div></div></div>
    </section>
    <section class="panel">
      <h3><span data-i18n="today">Hoy</span><span class="more" id="open-boards" data-i18n="openBoards">Abrir</span></h3>
      <div class="list" id="tasks"><div class="empty" data-i18n="noTasks">Nada pendiente</div></div>
    </section>
    <section class="panel">
      <h3><span data-i18n="exams">Exámenes</span></h3>
      <div id="exams"><div class="empty" data-i18n="noExams">Sin exámenes</div></div>
    </section>
    <section class="panel folder" id="folder" role="button" tabindex="0">
      <h3><span data-i18n="myFiles">Mis archivos</span><span class="more" id="f-quick" data-i18n="upload">Subir</span></h3>
      <div class="fh">
        <div class="fi"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ecbea9" stop-opacity=".32"/><stop offset="1" stop-color="#d8ad7c" stop-opacity=".08"/></linearGradient></defs>
          <path d="M5 13a3 3 0 0 1 3-3h10.5l4 4.5H40a3 3 0 0 1 3 3V36a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="url(#fg)"/><path d="M5 19.5h38"/></svg></div>
        <div style="min-width:0;flex:1"><div class="ft" id="f-title"></div><div class="fs" id="f-count"></div></div>
      </div>
      <div class="thumbs" id="f-recent"></div>
    </section>
  </div>

  <!-- CENTRE -->
  <div class="centre" id="centre">
    <div class="core" id="core" title="Mute / unmute">
      <svg viewBox="-120 -120 240 240" aria-hidden="true">
        <defs>
          <radialGradient id="glow"><stop offset="0" stop-color="#ecbea9" stop-opacity=".35"/><stop offset="1" stop-color="#ecbea9" stop-opacity="0"/></radialGradient>
          <linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#d8ad7c"/><stop offset="1" stop-color="#ecbea9"/></linearGradient>
        </defs>
        <circle r="118" fill="url(#glow)" id="halo"/>
        <circle r="100" fill="none" stroke="rgba(236,190,170,.12)" stroke-width="1"/>
        <g id="ticks"></g>
        <circle id="ring1" r="88" fill="none" stroke="url(#arc)" stroke-width="2.2" stroke-dasharray="120 433" stroke-linecap="round"/>
        <circle id="ring2" r="76" fill="none" stroke="rgba(236,190,170,.5)" stroke-width="1" stroke-dasharray="4 8"/>
        <path id="wave" fill="none" stroke="#ecbea9" stroke-width="1.6" stroke-linejoin="round"/>
        <circle r="56" fill="rgba(28,14,22,.85)" stroke="rgba(236,190,170,.25)"/>
      </svg>
      <div class="label"><div class="name">ZAR</div></div>
    </div>
    <div class="state" id="state">OFFLINE</div>
    <div class="hint" id="hint"></div>
    <div class="bubble" id="bubble"></div>
    <div class="actions">
      <button class="pill" id="mic" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i18n="mic">Micro</span></button>
      <button class="pill" data-win="chat" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span data-i18n="chat">Chat</span></button>
      <button class="pill" data-win="boards" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg><span data-i18n="tasks">Tareas</span></button>
      <button class="pill" data-win="world" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span data-i18n="world">Mundo</span></button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="col">
    <section class="panel">
      <h3><span>Pomodoro</span></h3>
      <div class="pomo">
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(236,190,170,.12)" stroke-width="6"/>
            <circle id="pomo-arc" cx="60" cy="60" r="52" fill="none" stroke="url(#arc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
          <div class="tm" id="pomo-time">25:00</div>
        </div>
        <div class="side">
          <div class="mode" id="pomo-mode">Focus<small id="pomo-count">0</small></div>
          <div class="btns">
            <button class="btn" id="pomo-start" type="button">Start</button>
            <button class="btn" id="pomo-reset" type="button">Reset</button>
            <button class="btn" id="pomo-len" type="button">25/5</button>
          </div>
        </div>
      </div>
    </section>
    <section class="panel">
      <h3><span data-i18n="quick">Accesos</span></h3>
      <div class="grid" id="apps">
        <button class="app-btn" data-app="classroom" type="button"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/></svg>Classroom</button>
        <button class="app-btn" data-app="drive" type="button"><svg viewBox="0 0 24 24"><path d="M8 3h8l5 9-4 7H7l-4-7z"/><path d="M8 3l9 16M16 3L7 19M3 12h18"/></svg>Drive</button>
        <button class="app-btn" data-app="youtube" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>YouTube</button>
        <button class="app-btn" data-app="scholar" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h7v14H4zM13 5h7v14h-7z"/></svg>Scholar</button>
        <button class="app-btn" data-app="notebooklm" type="button"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2z"/><path d="M10 8h6M10 12h6"/></svg>NotebookLM</button>
        <button class="app-btn" data-app="translate" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h8M8 3v2c0 4-2 7-4 8M6 9c1 2 3 4 6 5"/><path d="M13 21l4-9 4 9M14.5 18h5"/></svg>Translate</button>
        <button class="app-btn" data-app="gemini" type="button"><svg viewBox="0 0 24 24"><path d="M12 3c1 5 4 8 9 9-5 1-8 4-9 9-1-5-4-8-9-9 5-1 8-4 9-9z"/></svg>Gemini</button>
        <button class="app-btn" data-app="gmail" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Gmail</button>
      </div>
    </section>
    <section class="panel grow">
      <h3><span data-i18n="news">IA y mundo</span><span class="more" id="news-speak" data-i18n="listen">Escuchar</span></h3>
      <div class="news" id="news"><div class="empty">…</div></div>
    </section>
    <div class="sys" id="sys"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="fveil" id="fveil"><div class="fpanel" id="fpanel" role="dialog" aria-modal="true">
  <header><h2 data-i18n="myFiles">Mis archivos</h2>
    <button class="pill" id="f-up" type="button"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span data-i18n="uploadFiles">Subir archivos</span></button>
    <button class="pill" id="f-openfolder" type="button"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i18n="openFolder">Abrir carpeta</span></button>
    <button class="x" id="f-close" type="button" aria-label="✕">✕</button></header>
  <div class="fbody"><div class="fgrid" id="f-grid"></div></div>
  <div class="drop" data-i18n="dropHere">Suelta aquí para subirlo</div>
  <input type="file" id="f-pick" multiple hidden>
</div></div>

<script>
(() => {
  const BASE = "http://127.0.0.1:5055";
  const TOKEN = "__HUD_TOKEN__";                 // filled in automatically on each PC
  const AUTH = { "X-ZAR-Token": TOKEN };
  const DEMO = location.search.includes("demo");
  const $ = id => document.getElementById(id);

  // ───────── i18n ─────────
  const T = {
    es: { today: "Hoy", openBoards: "Abrir", noTasks: "Nada pendiente para hoy 🎉", exams: "Exámenes", noExams: "Añade un examen: «Zar, tengo examen de Historia el 15 de enero»",
          quick: "Accesos", news: "IA y mundo", listen: "Escuchar", mic: "Micro", chat: "Chat", tasks: "Tareas", world: "Mundo",
          loadingWeather: "Cargando el tiempo…", morning: "Buenos días", afternoon: "Buenas tardes", evening: "Buenas noches",
          LISTENING: "Te escucho", STANDBY: "Di «Zar» para hablar", THINKING: "Pensando…", SPEAKING: "Hablando", MUTED: "Micro silenciado",
          OFFLINE: "ZAR se está iniciando…", DICTATING: "Dictando", focus: "Concentración", brk: "Descanso", sessions: "sesiones hoy",
          start: "Empezar", pause: "Pausa", reset: "Reiniciar", overdue: "atrasada", dueToday: "hoy", days: "días", daysOne: "día",
          todayExam: "hoy", opened: "Abriendo", offlineMsg: "Inicia ZAR primero", feels: "sensación", rain: "lluvia",
          myFiles: "Mis archivos", upload: "Subir", uploadFiles: "Subir archivos", openFolder: "Abrir carpeta", dropHere: "Suelta aquí para subirlo",
          emptyFolder: "Carpeta vacía", emptyHint: "Apuntes, PDF, fotos de la pizarra…", files: "archivos", fileOne: "archivo", last: "Último",
          emptyBig: "La carpeta está vacía.<br>Pulsa «Subir archivos» y elige apuntes, PDF o fotos.", open: "Abrir", toZar: "A ZAR", remove: "Quitar",
          sure: "¿Seguro?", uploading: "Subiendo", uploaded: "subido(s)" },
    en: { today: "Today", openBoards: "Open", noTasks: "Nothing due today 🎉", exams: "Exams", noExams: "Add an exam: “Zar, I have a History exam on January 15”",
          quick: "Quick launch", news: "AI & world", listen: "Listen", mic: "Mic", chat: "Chat", tasks: "Tasks", world: "World",
          loadingWeather: "Loading weather…", morning: "Good morning", afternoon: "Good afternoon", evening: "Good evening",
          LISTENING: "I'm listening", STANDBY: "Say “Zar” to talk", THINKING: "Thinking…", SPEAKING: "Speaking", MUTED: "Mic muted",
          OFFLINE: "ZAR is starting…", DICTATING: "Dictating", focus: "Focus", brk: "Break", sessions: "sessions today",
          start: "Start", pause: "Pause", reset: "Reset", overdue: "overdue", dueToday: "today", days: "days", daysOne: "day",
          todayExam: "today", opened: "Opening", offlineMsg: "Start ZAR first", feels: "feels", rain: "rain",
          myFiles: "My files", upload: "Upload", uploadFiles: "Upload files", openFolder: "Open folder", dropHere: "Drop here to upload",
          emptyFolder: "Empty folder", emptyHint: "Notes, PDFs, photos of the board…", files: "files", fileOne: "file", last: "Latest",
          emptyBig: "The folder is empty.<br>Press “Upload files” and pick notes, PDFs or photos.", open: "Open", toZar: "To ZAR", remove: "Remove",
          sure: "Sure?", uploading: "Uploading", uploaded: "uploaded" },
  };
  let lang = "es", owner = "";
  const t = k => (T[lang] || T.es)[k] ?? k;
  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    renderPomo();
  }
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }

  async function api(path, opts = {}) {
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), opts.timeout || 8000);
    try {
      const r = await fetch(BASE + path, { method: opts.method || "GET", headers: { ...AUTH, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
                                           body: opts.body ? JSON.stringify(opts.body) : undefined, signal: ctrl.signal, cache: "no-store" });
      return await r.json();
    } finally { clearTimeout(tm); }
  }

  // ───────── animated background ─────────
  const cv = $("bg"), cx = cv.getContext("2d");
  let W = 0, H = 0, pts = [];
  function resize() {
    W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
    const n = Math.round((innerWidth * innerHeight) / 26000);
    pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18, r: Math.random() * 1.4 + .4 }));
  }
  addEventListener("resize", resize); resize();
  let energy = 0;
  function drawBg() {
    cx.clearRect(0, 0, W, H);
    const g = cx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H) * .7);
    g.addColorStop(0, "rgba(70,30,45,.55)"); g.addColorStop(.5, "rgba(28,14,22,.4)"); g.addColorStop(1, "rgba(18,10,16,0)");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    // perspective grid
    cx.strokeStyle = "rgba(236,190,170,.045)"; cx.lineWidth = 1;
    const step = 64 * devicePixelRatio, off = (performance.now() / 60) % step;
    for (let x = -off; x < W; x += step) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); }
    for (let y = -off; y < H; y += step) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
    // particles + links
    const link = 120 * devicePixelRatio;
    for (const p of pts) {
      p.x += p.vx * (1 + energy * 4); p.y += p.vy * (1 + energy * 4);
      if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      cx.fillStyle = "rgba(245,205,190,.55)"; cx.beginPath(); cx.arc(a.x, a.y, a.r * devicePixelRatio, 0, 6.283); cx.fill();
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j], dx = a.x - b.x, dy = a.y - b.y, d = dx * dx + dy * dy;
        if (d < link * link) { cx.strokeStyle = `rgba(236,190,170,${.10 * (1 - Math.sqrt(d) / link)})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
      }
    }
  }

  // ───────── ZAR core ─────────
  const ticks = $("ticks");
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * Math.PI * 2, r1 = 104, r2 = i % 6 ? 108 : 113;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", Math.cos(a) * r1); l.setAttribute("y1", Math.sin(a) * r1); l.setAttribute("x2", Math.cos(a) * r2); l.setAttribute("y2", Math.sin(a) * r2);
    l.setAttribute("stroke", i % 6 ? "rgba(236,190,170,.18)" : "rgba(236,190,170,.45)"); l.setAttribute("stroke-width", "1");
    ticks.appendChild(l);
  }
  let live = { state: "OFFLINE", level_out: 0, level_in: 0, log: [] }, rot = 0;
  function drawCore(tms) {
    const lvl = Math.min(1, Math.max(live.level_out || 0, (live.level_in || 0) * .7) * 3.2);
    energy += (lvl - energy) * .15;
    const st = live.state;
    rot += st === "THINKING" ? 2.6 : st === "SPEAKING" ? 1.2 : .35;
    $("ring1").setAttribute("transform", `rotate(${rot})`);
    $("ring2").setAttribute("transform", `rotate(${-rot * .6})`);
    $("halo").setAttribute("r", 100 + energy * 22);
    // waveform ring
    const pts2 = [], N = 96, base = 64;
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const amp = (st === "SPEAKING" || st === "LISTENING" ? energy : .04) * 14;
      const r = base + Math.sin(a * 6 + tms / 180) * amp * .6 + Math.sin(a * 11 - tms / 130) * amp * .4;
      pts2.push(`${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)}`);
    }
    $("wave").setAttribute("d", "M" + pts2.join("L") + "Z");
    $("wave").setAttribute("stroke", st === "MUTED" ? "#ff6b81" : st === "THINKING" ? "#a98bff" : "#ecbea9");
  }
  function frame(tms) { drawBg(); drawCore(tms); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);

  // ───────── state polling ─────────
  let lastLogKey = "";
  async function poll() {
    try {
      const r = await fetch(BASE + "/state", { cache: "no-store" });
      const d = await r.json();
      live = d;
      if (d.lang && d.lang !== lang && T[d.lang]) { lang = d.lang; applyI18n(); }
      owner = d.owner || "";
    } catch { live = { state: "OFFLINE", level_out: 0, level_in: 0, log: [] }; }
    document.body.classList.toggle("offline", live.state === "OFFLINE");
    $("state").textContent = live.state;
    $("hint").textContent = t(live.state);
    $("mic").classList.toggle("muted", live.state === "MUTED" || !!live.muted);
    const last = [...(live.log || [])].reverse().find(e => e.who === "ai" || e.who === "user");
    const key = last ? last.t + last.text : "";
    if (key !== lastLogKey) {
      lastLogKey = key;
      $("bubble").innerHTML = last ? `<span class="who">${last.who === "ai" ? "ZAR" : esc(owner || (lang === "es" ? "Tú" : "You"))}</span>${esc(last.text)}` : "";
    }
    if (live.sys && live.sys.cpu != null) {
      const s = live.sys;
      $("sys").innerHTML = `CPU <b>${Math.round(s.cpu)}%</b> · RAM <b>${Math.round(s.ram)}%</b>` + (s.battery != null ? ` · BAT <b>${Math.round(s.battery)}%</b>` : "");
    }
    if (live.weather_changed && live.weather_changed !== weatherStamp) { weatherStamp = live.weather_changed; loadWeather(true); }
  }
  setInterval(poll, 150); poll();

  // ───────── clock / greeting ─────────
  function tick() {
    const d = new Date(), h = d.getHours();
    $("clock").textContent = d.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", hour12: false });
    const ds = d.toLocaleDateString(lang, { weekday: "long", day: "numeric", month: "long" }); $("date").textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
    const g = h < 12 ? t("morning") : h < 20 ? t("afternoon") : t("evening");
    $("hello").innerHTML = `${g}${owner ? `, <b>${esc(owner)}</b>` : ""}`;
  }
  setInterval(tick, 1000); tick();

  // ───────── weather ─────────
  let weatherStamp = 0;
  async function loadWeather(force) {
    try {
      const w = await api("/weather" + (force ? "?refresh=1" : ""), { timeout: 15000 });
      if (!w.ok) throw 0;
      const u = w.units === "F" ? "°F" : "°C";
      $("weather").innerHTML = `<span class="ico">${w.icon}</span><div><div class="t">${Math.round(w.temp)}${u}</div>
        <div class="d">${esc(w.text)} · ${esc(w.location)}<br>${Math.round(w.lo)}° / ${Math.round(w.hi)}° · ${t("rain")} ${w.rain ?? 0}%</div></div>`;
    } catch {}
  }
  setInterval(() => loadWeather(false), 10 * 60 * 1000); setTimeout(() => loadWeather(false), 1500);

  // ───────── tasks + exams (from Boards) ─────────
  const EXAM = /\b(exam|examen|exámen|test|parcial|final|midterm|quiz)\b/i;
  async function loadBoards() {
    let d;
    try { d = await api("/boards"); } catch { return; }
    if (!d || !d.ok) return;
    const today = d.today, open = [], exams = [];
    for (const b of d.boards) {
      const done = b.columns.find(c => /^(done|hecho|terminado|completado|finished|completed)$/i.test(c)) || b.columns[b.columns.length - 1];
      for (const x of b.tasks) {
        if (x.column === done) continue;
        const isExam = (x.tags || []).some(g => EXAM.test(g)) || EXAM.test(x.title);
        if (isExam && x.due && x.due >= today) exams.push(x);
        else if (x.due && x.due <= today) open.push({ ...x, board: b.name });
      }
    }
    open.sort((a, b) => a.due.localeCompare(b.due));
    $("tasks").innerHTML = open.length ? open.slice(0, 6).map(x =>
      `<div class="row" data-win="boards"><span class="dot ${x.due < today ? "over" : "today"}"></span><span class="txt">${esc(x.title)}</span>
       <span class="tag">${x.due < today ? t("overdue") : t("dueToday")}</span></div>`).join("") : `<div class="empty">${t("noTasks")}</div>`;
    exams.sort((a, b) => a.due.localeCompare(b.due));
    $("exams").innerHTML = exams.length ? exams.slice(0, 4).map(x => {
      const n = Math.round((new Date(x.due) - new Date(today)) / 86400000);
      const when = new Date(x.due + "T12:00").toLocaleDateString(lang, { weekday: "short", day: "numeric", month: "short" });
      return `<div class="exam ${n === 0 ? "now" : n <= 7 ? "soon" : ""}"><div class="days">${n === 0 ? `<span class="tdy">${t("todayExam")}</span>` : `${n}<small>${n === 1 ? t("daysOne") : t("days")}</small>`}</div>
        <div><div class="nm">${esc(x.title)}</div><div class="when">${when}</div></div></div>`;
    }).join("") : `<div class="empty">${t("noExams")}</div>`;
    document.querySelectorAll("#tasks [data-win]").forEach(el => el.onclick = () => openWin("boards"));
  }
  setInterval(loadBoards, 60000); setTimeout(loadBoards, 1200);

  // ───────── news (AI first) ─────────
  const AI = /\b(ai|a\.i\.|artificial intelligence|inteligencia artificial|ia|openai|chatgpt|gemini|anthropic|claude|llm|machine learning|robot|deepmind|nvidia|chip)\b/i;
  async function loadNews() {
    try {
      const d = await api("/news", { timeout: 20000 });
      if (!d.ok) throw 0;
      const items = (d.items || []).slice().sort((a, b) => (AI.test(b.title) - AI.test(a.title)));
      $("news").innerHTML = items.slice(0, 25).map(it =>
        `<div class="item ${AI.test(it.title) ? "ai" : ""}" data-id="${it.id}"><div class="h">${esc(it.title)}</div><div class="s">${esc(it.source || "")}</div></div>`).join("");
      $("news").querySelectorAll(".item").forEach(el => el.onclick = () => post("/open?news=" + el.dataset.id));
    } catch {}
  }
  setInterval(loadNews, 30 * 60 * 1000); setTimeout(loadNews, 2500);
  $("news-speak").onclick = () => post("/news_speak", 25000).then(() => toast("🔊"));

  // ───────── actions ─────────
  async function post(path, timeout = 15000, body) {
    if (DEMO) return { ok: true };
    if (live.state === "OFFLINE") { toast(t("offlineMsg")); return { ok: false }; }
    try { return await api(path, { method: "POST", timeout, body }); } catch { return { ok: false }; }
  }
  const openWin = page => post(`/window?page=${page}`).then(r => r && r.ok && toast(t("opened") + "…"));
  document.querySelectorAll("[data-win]").forEach(b => b.onclick = () => openWin(b.dataset.win));
  $("open-boards").onclick = () => openWin("boards");
  document.querySelectorAll("[data-app]").forEach(b => b.onclick = () => { toast(t("opened") + " " + b.textContent.trim() + "…"); post("/open?app=" + b.dataset.app, 45000); });
  const toggleMute = async () => { if (DEMO) return; try { await fetch(BASE + "/mute", { method: "POST" }); } catch {} };
  $("mic").onclick = toggleMute; $("core").onclick = toggleMute;


  // ───────── My files (folder) ─────────
  const ICONS = {
    pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    sheet: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>',
    video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
    audio: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  };
  const fsize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const thumb = f => f.kind === "image" ? `<img loading="lazy" alt="" src="${BASE}/file?name=${encodeURIComponent(f.name)}&t=${TOKEN}">`
                                        : `<svg viewBox="0 0 24 24">${ICONS[f.kind] || ICONS.file}</svg>`;
  let files = [];
  function renderFolder() {
    $("f-title").textContent = files.length ? `${files.length} ${files.length === 1 ? t("fileOne") : t("files")}` : t("emptyFolder");
    $("f-count").textContent = files.length ? `${t("last")}: ${files[0].name}` : t("emptyHint");
    $("f-recent").innerHTML = files.slice(0, 5).map(f => `<div class="tb" title="${esc(f.name)}">${thumb(f)}</div>`).join("")
      + (files.length > 5 ? `<div class="tb more">+${files.length - 5}</div>` : "");
  }
  async function loadFiles() {
    if (DEMO) { renderFolder(); return; }
    let d; try { d = await api("/files"); } catch { return; }
    if (!d || !d.ok) return;
    files = d.items; renderFolder();
    if ($("fveil").classList.contains("show")) renderFiles();
  }
  function renderFiles() {
    const g = $("f-grid");
    if (!files.length) { g.innerHTML = `<div class="fempty" style="grid-column:1/-1">${t("emptyBig")}</div>`; return; }
    g.innerHTML = files.map((f, i) => `<div class="tile" data-i="${i}">
      <div class="th">${thumb(f)}${f.kind === "image" ? "" : `<span class="ext">${esc((f.name.split(".").pop() || "").toUpperCase().slice(0, 5))}</span>`}</div>
      <div class="nm" title="${esc(f.name)}">${esc(f.name)}</div><div class="mt">${f.mtime} · ${fsize(f.size)}</div>
      <div class="ta"><button data-a="open" type="button">${t("open")}</button><button data-a="use" type="button">${t("toZar")}</button><button data-a="delete" type="button">${t("remove")}</button></div></div>`).join("");
    g.querySelectorAll(".tile").forEach(tile => tile.querySelectorAll("button").forEach(b => b.onclick = async () => {
      const f = files[+tile.dataset.i];
      if (b.dataset.a === "delete" && !b.classList.contains("arm")) {
        b.classList.add("arm"); b.textContent = t("sure"); setTimeout(() => { b.classList.remove("arm"); b.textContent = t("remove"); }, 3000); return;
      }
      const r = await post("/files_action", 15000, { action: b.dataset.a, name: f.name });
      if (r && r.msg) toast(r.msg);
      if (b.dataset.a === "delete") loadFiles();
      if (b.dataset.a === "use" && r && r.ok) closeFiles();
    }));
  }
  async function upload(list) {
    const arr = [...list].filter(f => f.size <= 100 * 1024 * 1024);
    if (!arr.length) return;
    let ok = 0;
    for (const f of arr) {
      toast(`${t("uploading")} ${f.name}…`);
      try { const r = await fetch(`${BASE}/upload?name=${encodeURIComponent(f.name)}`, { method: "POST", headers: AUTH, body: f }); if ((await r.json()).ok) ok++; } catch {}
    }
    toast(`${ok}/${arr.length} ${t("uploaded")}`);
    loadFiles();
  }
  function openFiles() { $("fveil").classList.add("show"); renderFiles(); loadFiles(); }
  function closeFiles() { $("fveil").classList.remove("show"); }
  $("folder").onclick = openFiles;
  $("folder").onkeydown = e => { if (e.key === "Enter" || e.key === " ") openFiles(); };
  $("f-quick").onclick = e => { e.stopPropagation(); $("f-pick").click(); };
  $("f-close").onclick = closeFiles;
  $("fveil").onclick = e => { if (e.target.id === "fveil") closeFiles(); };
  $("f-up").onclick = () => $("f-pick").click();
  $("f-pick").onchange = e => { upload(e.target.files); e.target.value = ""; };
  $("f-openfolder").onclick = () => post("/files_action", 15000, { action: "open_folder" }).then(r => r && r.msg && toast(r.msg));
  for (const el of [$("folder"), $("fpanel")]) {
    el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", e => { if (!el.contains(e.relatedTarget)) el.classList.remove("over"); });
    el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over"); if (e.dataTransfer.files.length) { upload(e.dataTransfer.files); if (el.id === "folder") openFiles(); } });
  }
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => e.preventDefault());
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeFiles(); });
  setInterval(loadFiles, 20000); setTimeout(loadFiles, 1300);

  // ───────── Pomodoro ─────────
  const store = { get(k, d) { try { const v = localStorage.getItem("zar-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                  set(k, v) { try { localStorage.setItem("zar-" + k, JSON.stringify(v)); } catch {} } };
  const LENGTHS = [[25, 5], [50, 10], [15, 3]];
  let pomo = store.get("pomo", { li: 0, mode: "focus", endsAt: 0, left: 25 * 60, running: false, count: 0, day: "" });
  const todayKey = new Date().toDateString();
  if (pomo.day !== todayKey) { pomo.count = 0; pomo.day = todayKey; }
  const total = () => (pomo.mode === "focus" ? LENGTHS[pomo.li][0] : LENGTHS[pomo.li][1]) * 60;
  function remaining() { return pomo.running ? Math.max(0, Math.round((pomo.endsAt - Date.now()) / 1000)) : pomo.left; }
  function renderPomo() {
    const r = remaining();
    $("pomo-time").textContent = `${String(Math.floor(r / 60)).padStart(2, "0")}:${String(r % 60).padStart(2, "0")}`;
    $("pomo-arc").setAttribute("stroke-dashoffset", (326.7 * (1 - r / total())).toFixed(1));
    $("pomo-mode").innerHTML = `${pomo.mode === "focus" ? t("focus") : t("brk")}<small>${pomo.count} ${t("sessions")}</small>`;
    $("pomo-start").textContent = pomo.running ? t("pause") : t("start");
    $("pomo-reset").textContent = t("reset");
    $("pomo-len").textContent = LENGTHS[pomo.li].join("/");
  }
  function save() { store.set("pomo", pomo); }
  $("pomo-start").onclick = () => {
    if (pomo.running) { pomo.left = remaining(); pomo.running = false; }
    else { pomo.endsAt = Date.now() + remaining() * 1000; pomo.running = true; }
    save(); renderPomo();
  };
  $("pomo-reset").onclick = () => { pomo.running = false; pomo.mode = "focus"; pomo.left = total(); save(); renderPomo(); };
  $("pomo-len").onclick = () => { if (pomo.running) return; pomo.li = (pomo.li + 1) % LENGTHS.length; pomo.left = total(); save(); renderPomo(); };
  setInterval(() => {
    if (pomo.running && remaining() === 0) {
      const wasFocus = pomo.mode === "focus";
      if (wasFocus) pomo.count++;
      pomo.mode = wasFocus ? "break" : "focus";
      pomo.left = total(); pomo.endsAt = Date.now() + pomo.left * 1000;     // next phase starts automatically
      save();
      post("/zar_event", 8000, { event: wasFocus ? "pomodoro_done" : "break_done" });
    }
    renderPomo();
  }, 500);

  applyI18n();
  if (DEMO) {
    live = { state: "LISTENING", level_out: 0, level_in: 0, log: [{ who: "ai", text: "¡Buenas! ¿Seguimos con el tema 4 de Biología o prefieres repasar las flashcards de hoy?", t: 1 }],
             sys: { cpu: 12, ram: 48, battery: 86 } };
    owner = "Lucía";
  }
})();
</script>
