<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAR · Weather settings</title>
<style>
  :root {
    --night: #030b14; --line: rgba(110,215,255,.22); --line-soft: rgba(110,215,255,.10);
    --cyan: #6fd8ff; --ice: #dff7ff; --text: #b7dcef; --text-dim: #5f8aa3; --alert: #ff6b7d; --green: #78f0be;
    --font: "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI Semibold", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; padding: 22px 22px 18px; font-family: var(--font); color: var(--text);
         background: radial-gradient(ellipse 120% 60% at 50% 0%, #0b2a44 0%, var(--night) 70%), var(--night); }
  h1 { font-size: 22px; font-weight: 500; color: var(--ice); letter-spacing: .03em; }
  .sub { margin: 4px 0 18px; font-size: 14px; color: var(--text-dim); }
  h2 { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); margin: 18px 0 8px; }
  label.opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
              border: 1px solid var(--line-soft); background: rgba(10,40,64,.35); font-size: 15px; }
  label.opt:hover { border-color: var(--line); }
  label.opt input { accent-color: #6fd8ff; }
  label.opt small { display: block; font-size: 13px; color: var(--text-dim); }
  .search { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; font-size: 15px; color: var(--ice);
                     background: rgba(3,14,24,.8); border: 1px solid var(--line); outline: none; }
  input[type=text]:focus { border-color: var(--cyan); }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 10px 14px; font-size: 15px; color: var(--ice); background: rgba(10,40,64,.55); border: 1px solid var(--line); }
  .btn:hover { border-color: var(--cyan); background: rgba(16,58,90,.7); }
  .btn.primary { border-color: var(--cyan); }
  .results { margin-top: 8px; }
  .results button { display: block; width: 100%; text-align: left; padding: 9px 12px; font-size: 15px; color: var(--text);
                    background: none; border: 0; border-bottom: 1px solid var(--line-soft); }
  .results button:hover, .results button.sel { color: var(--ice); background: rgba(16,58,90,.5); }
  .units { display: flex; gap: 8px; }
  .units label.opt { flex: 1; margin: 0; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .note { min-height: 18px; margin-top: 10px; font-size: 14px; color: var(--text-dim); }
  .note.ok { color: var(--green); } .note.bad { color: var(--alert); }
</style>
</head>
<body>
  <h1>Weather settings</h1>
  <div class="sub">Choose where the weather on your desktop comes from.</div>

  <h2>Location</h2>
  <label class="opt"><input type="radio" name="mode" value="auto" checked>
    <span>Detect automatically<small id="detected">Detecting…</small></span></label>
  <label class="opt"><input type="radio" name="mode" value="city">
    <span>Choose a city<small id="chosen">Search below and pick one</small></span></label>
  <div class="search">
    <input type="text" id="q" placeholder="Search a city, e.g. Aberdeen" autocomplete="off">
    <button class="btn" id="go" type="button">Search</button>
  </div>
  <div class="results" id="results"></div>

  <h2>Units</h2>
  <div class="units">
    <label class="opt"><input type="radio" name="units" value="C" checked> Celsius (°C)</label>
    <label class="opt"><input type="radio" name="units" value="F"> Fahrenheit (°F)</label>
  </div>

  <div class="actions">
    <button class="btn" id="cancel" type="button">Close</button>
    <button class="btn primary" id="save" type="button">Save</button>
  </div>
  <div class="note" id="note"></div>

<script>
(() => {
  const AUTH = { "X-ZAR-Token": "__HUD_TOKEN__" };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let chosen = null, results = [];
  const note = (t, cls) => { $("note").textContent = t || ""; $("note").className = "note " + (cls || ""); };
  const setMode = m => document.querySelector(`input[name=mode][value=${m}]`).checked = true;

  async function load() {
    try {
      const s = await (await fetch("/settings", { headers: AUTH })).json();
      document.querySelector(`input[name=units][value=${s.units || "C"}]`).checked = true;
      if (s.location) {
        chosen = s.location; setMode("city");
        $("chosen").textContent = "Current: " + s.location.name;
        $("detected").textContent = "Uses your internet connection to find you";
      } else {
        $("detected").textContent = s.detected ? "Detected: " + s.detected.name : "Couldn't detect it right now";
      }
    } catch { note("ZAR isn't running.", "bad"); }
  }

  async function search() {
    const q = $("q").value.trim();
    if (q.length < 2) return;
    note("Searching…");
    try {
      const d = await (await fetch("/geocode?q=" + encodeURIComponent(q), { headers: AUTH })).json();
      results = d.results || [];
      $("results").innerHTML = results.length
        ? results.map((r, i) => `<button type="button" data-i="${i}">${esc(r.label)}</button>`).join("")
        : `<div class="note">No cities found.</div>`;
      note("");
    } catch { note("Search failed. Check your internet connection.", "bad"); }
  }

  $("go").addEventListener("click", search);
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
  $("results").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const r = results[+b.dataset.i];
    chosen = { name: r.name, lat: r.lat, lon: r.lon };
    [...$("results").children].forEach(x => x.classList.toggle("sel", x === b));
    $("chosen").textContent = "Selected: " + r.label;
    setMode("city");
  });
  $("cancel").addEventListener("click", () => window.close());
  $("save").addEventListener("click", async () => {
    const mode = document.querySelector("input[name=mode]:checked").value;
    const units = document.querySelector("input[name=units]:checked").value;
    if (mode === "city" && !chosen) { note("Search for a city and pick one first.", "bad"); return; }
    try {
      const r = await fetch("/settings", { method: "POST", headers: { ...AUTH, "Content-Type": "application/json" },
                                          body: JSON.stringify({ location: mode === "auto" ? null : chosen, units }) });
      if (!(await r.json()).ok) throw new Error();
      note("Saved. Your desktop will update in a moment.", "ok");
      setTimeout(() => window.close(), 1200);
    } catch { note("Couldn't save. Is ZAR running?", "bad"); }
  });
  load();
})();
</script>
</body>
</html>
